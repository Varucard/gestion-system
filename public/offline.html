<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión</title>
  <style>
    /* Página autónoma: no depende de ningún otro archivo, porque se muestra justamente cuando no hay red. */
    :root { color-scheme: dark; --fondo: #0a0820; --texto: #eeebfa; --suave: #aaa4c9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto); font-family: "Saira Semi Condensed", system-ui, Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { text-transform: uppercase; letter-spacing: .04em; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    p { color: var(--suave); max-width: 320px; margin: 0 auto 1.5rem; }
    button { background: linear-gradient(100deg, #7b4ee0, #9b3592 55%, #5866e0); color: #fff; border: 0; border-radius: 10px; padding: .85rem 1.6rem; font: 600 1rem inherit; text-transform: uppercase; letter-spacing: .06em; box-shadow: 0 8px 28px -10px #9b3592; }
  </style>
</head>

<body>
  <main>
    <img src="assets/img/logo.png" alt="">
    <h1>Sin conexión</h1>
    <p>No hay conexión con el sistema. Revisá el wifi o los datos del teléfono y volvé a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>

</html>
