<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión</title>
  <style>
    /* Página autónoma: no depende de ningún otro archivo, porque se muestra justamente cuando no hay red. */
    :root { color-scheme: light dark; --fondo: #f8f9fa; --texto: #212529; --suave: #6c757d; --boton: #0d6efd; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #111827; --texto: #e5e7eb; --suave: #9ca3af; --boton: #2563eb; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto); font-family: Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    p { color: var(--suave); max-width: 320px; margin: 0 auto 1.5rem; }
    button { background: var(--boton); color: #fff; border: 0; border-radius: 6px; padding: .75rem 1.5rem; font-size: 1rem; }
  </style>
</head>

<body>
  <main>
    <img src="assets/img/logo.png" alt="">
    <h1>Sin conexión</h1>
    <p>No hay conexión con el sistema. Revisá el wifi o los datos del teléfono y volvé a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>

</html>
